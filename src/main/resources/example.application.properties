spring.application.name=SpringAIDemo
# key
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

# chat
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.response-mime-type=text/plain
spring.ai.google.genai.chat.max-output-tokens=200
spring.ai.google.genai.chat.temperature=0.4

# image
spring.ai.model.image=none
spring.ai.model.image=google-genai
spring.ai.google.genai.image.n=1
spring.ai.google.genai.image.model=gemini-3.1-flash-image

# text to speed
spring.ai.jinfer.speech.model=remixerdec/Inflect-Nano-v2-GGUF:Q8_0
spring.ai.jinfer.speech.companions.lexicon=remixerdec/Inflect-Nano-v2-GGUF/lexicon.bin
spring.ai.jinfer.speech.speed=1.0

# speed to text
spring.ai.jinfer.transcription.model=mudler/parakeet-cpp-gguf/tdt-0.6b-v3-q8_0.gguf